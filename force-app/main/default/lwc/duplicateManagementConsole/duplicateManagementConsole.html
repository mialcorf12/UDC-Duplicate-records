<template>
    <lightning-card>
    <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>

        <lightning-accordion-section name="clusters" label="Clusters">
            <div class="slds-grid slds-wrap console-container">
                <!-- Left column: Filter + List (30%) -->
                <div class="slds-box slds-col slds-size_4-of-12 slds-border_right left-panel">
                    <c-duplicate-filter-bar
                        onfilterchange={handleFilterChange}
                    ></c-duplicate-filter-bar>
                    <c-duplicate-cluster-list
                        object-type={objectType}
                        status={status}
                        min-score={minScore}
                        onclusterselect={handleClusterSelect}
                    ></c-duplicate-cluster-list>
                </div>

                <!-- Right column: Detail (70%) -->
                <div class="slds-box slds-col slds-size_8-of-12 right-panel">
                    <template if:true={selectedClusterId}>
                        <c-duplicate-cluster-detail
                            cluster-id={selectedClusterId}
                            onclustermerged={handleClusterMerged}
                        ></c-duplicate-cluster-detail>
                    </template>
                    <template if:false={selectedClusterId}>
                        <div class="slds-illustration slds-illustration_small slds-var-p-around_xx-large">
                            <div class="slds-text-longform slds-text-align_center">
                                <p class="slds-text-heading_medium slds-text-color_weak">
                                    Select a cluster to review
                                </p>
                                <p class="slds-text-body_regular slds-text-color_weak">
                                    Choose a duplicate cluster from the list on the left to compare records and take action.
                                </p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </lightning-accordion-section>

        <lightning-accordion-section name="advanced" label="Advanced Options">
            <!-- Bulk Merge -->
            <div class="slds-box slds-col slds-size_4-of-12 left-panel">
                <p class="slds-text-title_caps slds-var-m-bottom_x-small">Bulk Merge</p>
                <div class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end slds-var-p-around_small">
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-combobox
                            label="Object Type" value={bulkMergeObjectType}
                            options={bulkMergeObjectTypeOptions}
                            onchange={handleBulkObjectTypeChange}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-input
                            type="text" label="Status" value="Open" disabled
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-input
                            type="number" min="0" max="100"
                            label="Min Score" value={bulkMergeScore}
                            onchange={handleBulkScoreChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-button
                            class="slds-var-m-top_x-small" label="Merge"
                            variant="brand" disabled={isBulkMerging}
                            onclick={handleBulkMerge}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </lightning-accordion-section>

    </lightning-accordion>
    </lightning-card>
</template>
