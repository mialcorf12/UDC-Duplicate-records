<template>
    <template if:true={isVisible}>
        <div class="slds-var-m-around_small">

            <!-- Failed -->
            <template if:true={isFailed}>
                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <lightning-icon
                        icon-name="utility:error"
                        variant="inverse"
                        size="x-small"
                        class="slds-var-m-right_x-small"
                    ></lightning-icon>
                    <h2>Merge failed. Please review the audit log and try again.</h2>
                </div>
            </template>

            <!-- Completed -->
            <template if:true={isCompleted}>
                <div class="slds-notify slds-notify_alert slds-theme_success" role="status">
                    <span class="slds-assistive-text">Success</span>
                    <lightning-icon
                        icon-name="utility:success"
                        variant="inverse"
                        size="x-small"
                        class="slds-var-m-right_x-small"
                    ></lightning-icon>
                    <h2>Merge completed successfully.</h2>
                </div>
            </template>

            <!-- In progress -->
            <template if:false={isFailed}>
                <template if:false={isCompleted}>
                    <div class="progress-container">
                        <div class="step-row">
                            <template for:each={steps} for:item="s">
                                <div key={s.label} class={s.containerClass}>
                                    <div class="step-dot">
                                        <lightning-icon
                                            if:true={s.isComplete}
                                            icon-name="utility:check"
                                            size="xx-small"
                                            variant="inverse"
                                            alternative-text={s.label}
                                        ></lightning-icon>
                                    </div>
                                    <span class="step-label">{s.label}</span>
                                </div>
                            </template>
                        </div>
                        <lightning-progress-bar value={progressPercent} size="medium"></lightning-progress-bar>
                        <p class="slds-text-body_small slds-text-color_weak slds-text-align_center slds-var-m-top_x-small">
                            {statusLabel} ({progressPercent}%)
                        </p>
                    </div>
                </template>
            </template>

        </div>
    </template>
</template>
