<template>
    <tr class="slds-hint-parent">
        <td class="slds-cell-wrap">
            <span class="slds-text-body_small slds-text-color_default">
                {fieldLabel}
            </span>
        </td>
        <template for:each={values} for:item="val">
            <td key={val.recordId} class="slds-cell-wrap">
                <div class="slds-form-element">
                    <div class="slds-form-element__control">
                        <span class="slds-radio">
                            <input
                                type="radio"
                                name={fieldName}
                                id={val.inputId}
                                value={val.recordId}
                                checked={val.isSelected}
                                onchange={handleRadioChange}
                            />
                            <label class="slds-radio__label" for={val.inputId}>
                                <span class="slds-radio_faux"></span>
                                <span class="slds-form-element__label slds-truncate" title={val.value}>
                                    {val.value}
                                </span>
                            </label>
                        </span>
                    </div>
                </div>
            </td>
        </template>
    </tr>
</template>
